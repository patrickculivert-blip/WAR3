<style>
  :root {
      --bg-body: #0d0d0d; --bg-card: #171717; --text-main: #f5f5f5; --text-dim: #999999;
      --accent-orange: #f97316; --online: #22c55e; --offline: #ef4444; --blue-alt: #06b6d4;
      --border-color: #333333; --shadow-outer: 6px 6px 12px rgba(0,0,0,0.8);

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  
  body { 
      background-color: var(--bg-body); 
      color: var(--text-main); 
      transition: 0.3s; 
      overflow-x: hidden; 
  }

  .wrap { max-width: 900px; margin: 0 auto; padding: 40px 20px; }

  /* HEADER INFO */
  .header-logo { text-align: center; margin-bottom: 35px; }
  .header-logo h1 { font-size: 2.2em; letter-spacing: 2px; font-weight: 900; }

  /* NAVIGATION GRID */
  .tab-nav-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 30px; transition: 0.3s; }
  .tab-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-dim); padding: 12px 5px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.9em; transition: 0.2s; text-align: center; white-space: nowrap; }
  .tab-btn.active { background: var(--accent-orange); color: #fff; border-color: var(--accent-orange); }

  .page { display: none; animation: fadeIn 0.4s ease; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .card { background: var(--bg-card); border: 1px solid var(--border-color); border-bottom: 4px solid #000; padding: 25px; border-radius: 12px; margin-bottom: 20px; box-shadow: var(--shadow-outer); transition: 0.3s; }

  /* ACCORDION */
  .acc-item { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .acc-header { padding: 15px 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); transition: 0.3s; }
  .acc-header:hover { background: rgba(255,255,255,0.05); }
  .acc-content { display: none; padding: 20px; border-top: 1px solid var(--border-color); background: var(--bg-card); }
  .version-tag { background: var(--accent-orange); color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 0.8em; font-weight: bold; }
  
  .change-list { list-style: none; padding-left: 5px; margin-top: 8px; font-size: 0.9em; color: var(--text-dim); line-height: 1.6; }
  .change-list li { margin-bottom: 8px; position: relative; padding-left: 15px; }
  .change-list li::before { content: "•"; position: absolute; left: 0; color: var(--accent-orange); }

  .btn-action { width: 100%; padding: 14px; background: var(--accent-orange); border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; border-bottom: 3px solid #b45309; transition: 0.2s; }
  .btn-action:active { transform: translateY(2px); border-bottom: 1px solid #b45309; }
  .btn-secondary { background: #444; border-bottom: 3px solid #222; }
  .btn-green { background: #22c55e; border-bottom: 3px solid #166534; }

  // Fungsi Pengubah Warna Teks Minecraft
  function parseMCColors(text) {
    if (!text) return text;
    const colors = { '0': '#000', '1': '#00A', '2': '#0A0', '3': '#0AA', '4': '#A00', '5': '#A0A', '6': '#FA0', '7': '#AAA', '8': '#555', '9': '#55F', 'a': '#5F5', 'b': '#5FF', 'c': '#F55', 'd': '#F5F', 'e': '#FF5', 'f': '#FFF' };
    let parsed = text.replace(/&([0-9a-f])/ig, (m, p1) => `</span><span style="color:${colors[p1.toLowerCase()]}">`);
    parsed = parsed.replace(/&l/ig, '</span><span style="font-weight:bold;">');
    parsed = parsed.replace(/&o/ig, '</span><span style="font-style:italic;">');
    parsed = parsed.replace(/&r/ig, '</span><span style="color:inherit; font-weight:normal; font-style:normal;">');
    return `<span>${parsed}</span>`.replace(/<span><\/span>/g, '');
  }
  
  function convertToHTML(text) {
      if (!text) return "";
      let lines = text.split('\n'); let html = ""; let inList = false;
      for (let i = 0; i < lines.length; i++) {
          let line = lines[i].trim();
          if (line.startsWith('- ') || line.startsWith('• ') || line.startsWith('* ')) {
              if (!inList) { html += '<ul class="change-list">'; inList = true; }
              html += `<li>${parseMCColors(line.substring(2))}</li>`;
          } else {
              if (inList) { html += '</ul>'; inList = false; }
              if (line === "") { if (!html.endsWith('<br>')) html += "<br>"; } 
              else { html += `<span style="display:block; margin-top:5px; margin-bottom:5px; font-weight:bold;">${parseMCColors(line)}</span>`; }
          }
      }
      if (inList) html += '</ul>'; return html;
  }

  function loadLocalData() {
    document.getElementById('changelog').innerHTML = dbData.changelogs.map(d => `
      <div class="acc-item">
        <div class="acc-header" onclick="toggleAccordion(this)"><span class="version-tag">${parseMCColors(d.version)}</span><span style="font-size:0.8em; color:var(--text-dim)">${d.dateStr}</span></div>
        <div class="acc-content">${convertToHTML(d.rawContent)}</div>
      </div>`).join('');

    document.getElementById('product-list-container').innerHTML = dbData.products.map(prod => `
      <div class="card" style="padding:0; overflow:hidden; border-bottom: 4px solid var(--accent-orange); cursor:pointer; transition: transform 0.2s;" onclick="openProductDetail('${prod.id}')" onmouseover="this.style.transform='translateY(-3px)'" onmouseout="this.style.transform='translateY(0)'">

             <h3 style="color:white; margin-bottom:5px; font-size:1.3em;">${parseMCColors(prod.name)}</h3>

             <h4 style="color:var(--online); margin-top:12px; font-size:1.1em;">${parseMCColors(prod.price)}</h4>
          </div>
          <div style="background:rgba(255,255,255,0.03); padding:12px 20px; text-align:right; font-size:0.85em; color:var(--accent-orange); font-weight:bold; border-top: 1px solid var(--border-color);">Lihat Detail & Order ➔</div>
      </div>
    `).join('');
  }

  function openProductDetail(pId) {

    if(!prod) return;

  function fetchCommunityData() {
    const url = `https://discord.com/api/v9/invites/EHun8bpSq?with_counts=true`;
    fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url))
      .then(res => { if (!res.ok) throw new Error('API Response Error'); return res.json(); })
      .then(data => {
        if (data && data.approximate_member_count) { document.getElementById('discord-count').innerText = data.approximate_member_count.toLocaleString('id-ID'); } 
        else { document.getElementById('discord-count').innerText = "Ratusan"; }
      }).catch(err => { document.getElementById('discord-count').innerText = "Ratusan"; });
  }
  
  function showPage(id) { 
    document.querySelectorAll('.page, .tab-btn').forEach(el => el.classList.remove('active')); 
    document.getElementById(id).classList.add('active'); 
    let btnId = (id === 'product-detail') ? 'btn-products' : 'btn-' + id;
    let btn = document.getElementById(btnId); if(btn) btn.classList.add('active'); 
    
    if(id === 'product-detail') {
        document.getElementById('navPanel').style.display = 'none';
    } else {
        document.getElementById('navPanel').style.display = 'grid';
    }
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  
  function toggleAccordion(h) { 
    const c = h.nextElementSibling; const isOpen = c.style.display === 'block'; 
    h.closest('.page').querySelectorAll('.acc-content').forEach(el => el.style.display = 'none'); 
    if (!isOpen) c.style.display = 'block';
  }

  window.onload = () => {
    loadLocalData();
    fetchCommunityData(); 
  };
</script>
